<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पुस्तक | Shikshit Mitra</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0f1018;
  --surface:#1a1b26;
  --border:rgba(255,255,255,0.07);
  --text:#e8e9f0;
  --muted:#888;
  --accent:#8c6ed6;
  /* Page colours — light sage green tint */
  --page-bg:#eef5ec;
  --page-bg-left:#e6f0e3;
  --page-line:#c8dfc4;
  --page-text:#1a1a2e;
  --page-head:#2d1f6a;
  --spine:#2d1f5e;
  --margin-w:40px;
}

html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ── Topbar ── */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 16px;height:52px;
  background:var(--surface);border-bottom:1px solid var(--border);
  flex-shrink:0;z-index:10;
}
.app-logo{width:26px;height:26px;border-radius:6px;object-fit:contain;flex-shrink:0;display:none}
.app-logo.visible{display:block}
.topbar-title{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Serif Devanagari',serif}
.topbar-page{font-size:13px;color:var(--muted);white-space:nowrap}
.topbar-page__sep{margin:0 2px}

/* ── Stage ── */
.stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse at center,#1e1f2e 0%,#0f1018 100%);
}

/* ── Nav arrows ── */
.nav{
  position:absolute;top:50%;transform:translateY(-50%);
  width:40px;height:40px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:50%;color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:5;transition:background .15s;flex-shrink:0;
}
.nav:hover{background:rgba(255,255,255,0.14)}
.nav:disabled{opacity:.2;cursor:default;pointer-events:none}
.nav svg{width:20px;height:20px}
.nav--left{left:12px}
.nav--right{right:12px}

/* ── Book wrapper ── */
.book-wrap{perspective:2000px;display:flex;align-items:center;justify-content:center;position:relative}

/* ── The book ── */
.book{
  position:relative;display:flex;
  transform-style:preserve-3d;
  filter:drop-shadow(0 24px 48px rgba(0,0,0,0.6));
}

/* ── Page ── */
.page{
  width:var(--pw);height:var(--ph);
  background:var(--page-bg);
  position:relative;overflow:hidden;flex-shrink:0;
}
.page--left{
  border-radius:4px 0 0 4px;
  background:linear-gradient(to right,var(--page-bg-left),var(--page-bg));
  border-right:1px solid var(--page-line);
}
.page--right{border-radius:0 4px 4px 0;background:var(--page-bg)}

/* Spine shadows */
.page--left::after{
  content:'';position:absolute;top:0;right:0;width:28px;height:100%;
  background:linear-gradient(to left,rgba(0,0,0,0.07),transparent);
  pointer-events:none;
}
.page--right::before{
  content:'';position:absolute;top:0;left:0;width:28px;height:100%;
  background:linear-gradient(to right,rgba(0,0,0,0.05),transparent);
  pointer-events:none;z-index:1;
}

/* Spine */
.spine{
  width:12px;height:var(--ph);
  background:linear-gradient(to bottom,#4a2d8a,var(--spine),#2a1a50);
  flex-shrink:0;
  box-shadow:inset -2px 0 4px rgba(0,0,0,0.3),inset 2px 0 4px rgba(0,0,0,0.3);
}

/* ── Page inner (flex column: header | blocks | footer) ── */
.page-inner{
  padding:0;
  height:100%;display:flex;flex-direction:column;
  position:relative;z-index:2;
}

/* ── Per-page header — full-width dark green ribbon (matches PDF style) ── */
.pg-header{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;
  background:linear-gradient(135deg,#1a4a2e 0%,#2d7a48 60%,#1e5c35 100%);
  flex-shrink:0;
}
.pg-logo{
  width:calc(32px * var(--fs,1));
  height:calc(32px * var(--fs,1));
  border-radius:6px;object-fit:contain;flex-shrink:0;
  background:rgba(255,255,255,0.12);padding:2px;
}
.pg-logo-blank{
  width:calc(32px * var(--fs,1));
  height:calc(32px * var(--fs,1));
  flex-shrink:0;
}
.pg-title-wrap{display:flex;flex-direction:column;gap:1px;overflow:hidden;}
.pg-title{
  font-family:'Inter',sans-serif;
  font-size:calc(11px * var(--fs,1));font-weight:700;
  color:#fff;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
.pg-title-nep{font-family:'Noto Serif Devanagari',serif;font-weight:600;}


/* ── Page blocks (questions + banners) ── */
.page-blocks{flex:1;overflow:hidden}

/* Row layout: narrow margin column + content column */
.page-row{display:flex;align-items:stretch}

.margin-cell{
  width:var(--margin-w);flex-shrink:0;
  border-right:1px solid rgba(210,60,60,0.28);
  display:flex;justify-content:center;
  padding-top:3px;
}

.content-cell{flex:1;min-width:0;padding:0 20px 0 10px}

/* ── Question number label ── */
.q-num{
  font-family:'Noto Serif Devanagari',serif;
  font-size:calc(10px * var(--fs,1));font-weight:700;line-height:1.3;
  color:var(--accent);text-align:center;
}

/* ── Ruled question block ── */
.q-text-wrap{
  overflow:hidden;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent 0px,transparent 23px,
    var(--page-line) 23px,var(--page-line) 24px
  );
}
.q-text{
  font-family:'Noto Serif Devanagari',serif;
  font-size:calc(13px * var(--fs,1));
  line-height:24px;
  color:var(--page-text);
  white-space:pre-wrap;word-break:break-word;
}

/* ── Section banner ── */
.banner-row{padding:4px 20px 4px calc(var(--margin-w) + 10px)}
.section-banner{
  background:linear-gradient(135deg,var(--accent),#6b4fb3);
  color:#fff;
  font-family:'Noto Serif Devanagari',serif;
  font-size:calc(11px * var(--fs,1));font-weight:700;letter-spacing:.04em;
  text-align:center;padding:5px 10px;border-radius:4px;
}

/* ── Per-page footer ── */
.pg-footer{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 20px 5px calc(var(--margin-w) + 12px);
  border-top:1px solid var(--page-line);
  flex-shrink:0;
}
.pg-footer-name{
  font-family:'Inter',sans-serif;
  font-size:calc(8px * var(--fs,1));color:var(--muted);white-space:nowrap;
}
.pg-footer-num{
  font-size:calc(9px * var(--fs,1));color:var(--muted);letter-spacing:.05em;
}

/* ── Flip animation ── */
.flip-container{
  position:absolute;top:0;
  width:var(--pw);height:var(--ph);
  transform-style:preserve-3d;pointer-events:none;z-index:10;
}
.flip-container.is-right{left:50%;transform-origin:left center}
.flip-container.is-left{right:50%;transform-origin:right center}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.flip-face--back{transform:rotateY(180deg)}

/* ── Overlays ── */
.overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:var(--bg);z-index:30;border-radius:6px;
}
.overlay.is-hidden{display:none}
.spinner{
  width:34px;height:34px;
  border:3px solid rgba(255,255,255,0.08);
  border-top-color:var(--accent);
  border-radius:50%;animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay-text{font-size:14px;color:var(--muted)}
.retry-btn{padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:'Noto Serif Devanagari',serif}

/* ── Toolbar ── */
.toolbar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:44px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;
}
.tbtn{
  width:34px;height:34px;background:transparent;border:none;border-radius:6px;
  color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
}
.tbtn:hover{background:rgba(255,255,255,0.07);color:var(--text)}
.tbtn svg{width:17px;height:17px}

/* ── Toast ── */
.toast{
  position:fixed;bottom:56px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:#2a2b38;color:var(--text);font-size:13px;
  padding:8px 18px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  white-space:nowrap;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Single page mode (mobile / narrow) ── */
.book.single .page--left{display:none}
.book.single .spine{display:none}
.book.single .page--right{border-radius:4px}

@media(max-width:600px){
  .nav--left{left:4px}
  .nav--right{right:4px}
}
</style>
</head>

<div class="app">

  <header class="topbar">
    <button class="tbtn" id="backBtn" aria-label="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    <img class="app-logo" id="appLogo" alt="">
    <div class="topbar-title" id="bookTitle">शिक्षित मित्र</div>

        <button class="retry-btn" id="retryBtn">फेरि प्रयास गर्नुहोस्</button>
      </div>

    <button class="nav nav--right" id="nextBtn" aria-label="next">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </main>

  <footer class="toolbar">
    <button class="tbtn" id="fullBtn" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
  </footer>

  <div class="toast" id="toast"></div>
</div>

/* ── Toast ── */
var _tt;
function toast(msg){
  el.toast.textContent=msg;el.toast.classList.add("show");
  clearTimeout(_tt);_tt=setTimeout(function(){el.toast.classList.remove("show");},1800);
}

/* ── HTML escaping (we build page HTML via innerHTML) ── */
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ── CSV parser ── */
function parseCSV(text){
  var rows=[],lines=text.split(/\r?\n/);
  lines.forEach(function(line){
    if(!line.trim())return;
    var cols=[],cur="",inQ=false;
    for(var i=0;i<line.length;i++){
      var ch=line[i];
      if(inQ){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else inQ=false;}else cur+=ch;}
      else{if(ch==='"')inQ=true;else if(ch===','){cols.push(cur.trim());cur="";}else cur+=ch;}
    }
    cols.push(cur.trim());rows.push(cols);
  });
  return rows;
}

/* ── Fetch & parse sheet ── */
function fetchPages(){
  return fetch(SHEET_URL)
    .then(function(r){if(!r.ok)throw new Error(r.status);return r.text();})
    .then(function(csv){
      var rows=parseCSV(csv);
      if(rows.length<2)throw new Error("empty");
      var h=rows[0].map(function(x){return x.toLowerCase().trim();});
      var cBook=h.indexOf("book"),cTitle=h.indexOf("title"),
          cContent=h.indexOf("content"),cOrder=h.indexOf("order"),
          cSection=h.indexOf("section"),cLines=h.indexOf("lines");
      if(cBook<0)throw new Error("no book column");
      var out=[];
      for(var r=1;r<rows.length;r++){
        var row=rows[r];
        if(!row[cBook])continue;
        if(row[cBook].toLowerCase().trim()!==BOOK_FILTER)continue;
        var lines=cLines>=0?Math.ceil(parseFloat(row[cLines])):NaN;
        if(!lines||lines<1)lines=DEFAULT_LINES;
        out.push({
          title:   cTitle>=0   ? row[cTitle]||""   : "",
          content: cContent>=0 ? row[cContent]||"" : "",
          section: cSection>=0 ? row[cSection]||"" : "",
          lines:   lines,
          order:   cOrder>=0   ? parseInt(row[cOrder],10)||9999 : 9999
        });
      }
      out.sort(function(a,b){return a.order-b.order;});
      return out;
    });
}

/* ── Layout — compute page dimensions & font scale ── */
function layout(){
  var sw=el.stage.clientWidth-96;
  var sh=el.stage.clientHeight-16;
  state.single=sw<520;

  var ph=sh;
  var pw=state.single?sw:sw/2;
  pw=Math.floor(pw);ph=Math.floor(ph);
  state.ph=ph;state.pw=pw;

  el.book.style.setProperty("--pw",pw+"px");
  el.book.style.setProperty("--ph",ph+"px");
  el.book.classList.toggle("single",state.single);

  /* Font scale: design baseline is 300px page width.
     Clamp so fonts stay readable on very small or very large screens. */
  var fs=Math.max(0.78,Math.min(1.25,pw/300));
  el.book.style.setProperty("--fs",fs.toFixed(3));
}

/* ── Lines available per page ── */
function computeLinesPerPage(){
  return Math.max(5,Math.floor((state.ph-PAGE_OVERHEAD)/LINE_H));
}

/* ── Pack flat item list into pages, injecting section banners ── */
function buildPages(items,linesPerPage){
  var pages=[],current,used,lastSection;
  function startPage(){current={blocks:[]};pages.push(current);used=0;}
  startPage();
  items.forEach(function(item){
    var isFirstOnPage=current.blocks.length===0;
    var needBanner=!!item.section&&(isFirstOnPage||item.section!==lastSection);
    var cost=(needBanner?SECTION_BANNER_LINES:0)+item.lines;
    if(used>0&&used+cost>linesPerPage){
      startPage();
      needBanner=!!item.section;
      cost=(needBanner?SECTION_BANNER_LINES:0)+item.lines;
    }
    if(needBanner){
      current.blocks.push({type:"banner",text:item.section});
      used+=SECTION_BANNER_LINES;
      lastSection=item.section;
    }
    current.blocks.push({type:"question",title:item.title,content:item.content,lines:item.lines});
    used+=item.lines;
    if(item.section)lastSection=item.section;
  });
  if(pages.length&&pages[pages.length-1].blocks.length===0)pages.pop();
  if(!pages.length)pages.push({blocks:[]});
  pages.forEach(function(p,i){p.num=i+1;});
  return pages;
}

function repaginate(){
  var lpp=computeLinesPerPage();
  state.pages=buildPages(state.rawItems,lpp);
  TOTAL_PAGES=state.pages.length;
  if(state.cur>TOTAL_PAGES)state.cur=TOTAL_PAGES;
  if(state.cur<1)state.cur=1;
}

/* ── Build inner HTML for one page ──
   isRight = true  → right-side page (page number in footer right)
   isRight = false → left-side page  (app name only in footer left) */
function buildPageInnerHTML(pageObj,isRight){
  if(!pageObj)return "";

  var logoTag=LOGO_SRC
    ?'<img class="pg-logo" src="'+esc(LOGO_SRC)+'" alt="" onerror="this.style.display=\'none\'">'
    :'<span class="pg-logo-blank"></span>';

  /* Header — dark green ribbon: logo | title + subtitle */
  var html='<div class="pg-header">'
          +logoTag
          +'<div class="pg-title-wrap">'
          +'<span class="pg-title">Shikshit Mitra '
          +'<span class="pg-title-nep">(शिक्षित मित्र)</span></span>'
          
          +'</div>'
          +'</div>';

  /* Blocks */
  html+='<div class="page-blocks">';
  pageObj.blocks.forEach(function(b){
    if(b.type==="banner"){
      html+='<div class="page-row banner-row">'
           +'<div class="section-banner">'+esc(b.text)+'</div></div>';
    }else{
      html+='<div class="page-row">'
           +'<div class="margin-cell"><div class="q-num">'+esc(b.title)+'</div></div>'
           +'<div class="content-cell">'
           +'<div class="q-text-wrap" style="height:'+(b.lines*LINE_H)+'px">'
           +'<div class="q-text">'+esc(b.content)+'</div>'
           +'</div></div></div>';
    }
  });
  html+='</div>';

  /* Footer:
     Right page → app name (left) + page number (right)
     Left page  → app name (left) + blank (right) */
  html+='<div class="pg-footer">'
       +'<span class="pg-footer-name">Shikshit Mitra (शिक्षित मित्र)</span>'
       +(isRight
         ?'<span class="pg-footer-num">'+esc(pageObj.num)+'</span>'
         :'<span class="pg-footer-num"></span>')
       +'</div>';

  return html;
}

/* ── Render spread without animation ── */
function renderSpread(rightIdx){
  state.cur=rightIdx;
  var leftIdx=rightIdx-1;
  var rightPage=state.pages[rightIdx-1]||null;
  var leftPage=(!state.single&&leftIdx>=1)?state.pages[leftIdx-1]:null;
  el.rightInner.innerHTML=buildPageInnerHTML(rightPage,true);
  el.leftInner.innerHTML =buildPageInnerHTML(leftPage,false);
  el.pageCurrent.textContent=rightIdx;
  el.pageTotal.textContent=TOTAL_PAGES;
  el.prevBtn.disabled=rightIdx<=1;
  el.nextBtn.disabled=rightIdx>=TOTAL_PAGES;
}

/* ── Clone page HTML for flip animation ── */
function clonePageHTML(pageData,isRight){
  var div=document.createElement("div");
  div.className="page "+(isRight?"page--right":"page--left");
  div.style.cssText="width:100%;height:100%;position:absolute;inset:0;";
  var inner=document.createElement("div");
  inner.className="page-inner";
  inner.innerHTML=buildPageInnerHTML(pageData,isRight);
  div.appendChild(inner);
  return div.outerHTML;
}

/* ── Flip animation ── */
function animateFlip(toRight,toIdx,done){
  if(state.flipping)return;
  state.flipping=true;
  var leaf=el.flipLeaf,front=el.flipFront,back=el.flipBack;
  var frontIdx,backIdx;
  if(toRight){frontIdx=state.cur;backIdx=toIdx;leaf.className="flip-container is-right";}
  else{frontIdx=state.cur-1;backIdx=toIdx-1;leaf.className="flip-container is-left";}
  front.innerHTML=clonePageHTML(state.pages[frontIdx-1]||null,!toRight);
  back.innerHTML =clonePageHTML(state.pages[backIdx-1]||null, toRight);
  leaf.style.display="block";
  leaf.style.transform="rotateY(0deg)";
  leaf.style.transition="none";
  leaf.getBoundingClientRect();
  var startAngle=0,endAngle=toRight?-180:180,startTime=null;
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function tick(ts){
    if(!startTime)startTime=ts;
    var t=Math.min((ts-startTime)/FLIP_MS,1);
    leaf.style.transform="rotateY("+(startAngle+(endAngle-startAngle)*ease(t))+"deg)";
    if(t<1)requestAnimationFrame(tick);
    else{leaf.style.display="none";state.flipping=false;done();}
  }
  requestAnimationFrame(tick);
}

/* ── Navigation ── */
function goNext(){
  if(state.flipping||state.cur>=TOTAL_PAGES)return;
  var toIdx=state.cur+1;
  animateFlip(true,toIdx,function(){renderSpread(toIdx);});
}
function goPrev(){
  if(state.flipping||state.cur<=1)return;
  var toIdx=state.cur-1;
  animateFlip(false,toIdx,function(){renderSpread(toIdx);});
}

/* ── Swipe ── */
var _sx=0,_sy=0,_st=0;
el.stage.addEventListener("touchstart",function(e){
  var t=e.touches[0];_sx=t.clientX;_sy=t.clientY;_st=Date.now();
},{passive:true});
el.stage.addEventListener("touchend",function(e){
  var t=e.changedTouches[0];
  var dx=t.clientX-_sx,dy=t.clientY-_sy,dt=Date.now()-_st;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40&&dt<400){
    if(dx<0)goNext();else goPrev();
  }
},{passive:true});

/* ── Keyboard ── */
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown")goNext();
  if(e.key==="ArrowLeft" ||e.key==="ArrowUp")  goPrev();
});

/* ── Back ── */
el.backBtn.addEventListener("click",function(){
  if(window.history.length>1)window.history.back();
  else window.location.href="index.html";
});

/* ── Fullscreen ── */
el.fullBtn.addEventListener("click",function(){
  var isFull=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isFull){
    var req=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
    if(req)req.call(document.documentElement);
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }
});
/* Re-layout on fullscreen toggle so fonts and dimensions stay consistent */
function onFullscreenChange(){
  setTimeout(function(){layout();repaginate();renderSpread(state.cur);},80);
}
document.addEventListener("fullscreenchange",onFullscreenChange);
document.addEventListener("webkitfullscreenchange",onFullscreenChange);

/* ── Nav buttons ── */
el.prevBtn.addEventListener("click",goPrev);
el.nextBtn.addEventListener("click",goNext);
el.retryBtn.addEventListener("click",load);

/* ── Resize ── */
var _rt;
window.addEventListener("resize",function(){
  clearTimeout(_rt);
  _rt=setTimeout(function(){layout();repaginate();renderSpread(state.cur);},200);
});

/* ── Overlay helpers ── */
function showLoad(){el.overlayLoad.classList.remove("is-hidden");el.overlayErr.classList.add("is-hidden");}
function hideOverlays(){el.overlayLoad.classList.add("is-hidden");el.overlayErr.classList.add("is-hidden");}

/* ── Load ── */
var TOTAL_PAGES=1;

function load(){
  showLoad();
  state.rawItems=[];state.cur=1;
  el.bookTitle.textContent=state.title;

  /* Wire topbar logo */
  if(LOGO_SRC){
    el.appLogo.onload =function(){el.appLogo.classList.add("visible");};
    el.appLogo.onerror=function(){el.appLogo.classList.remove("visible");};
    el.appLogo.src=LOGO_SRC;
  }

  layout();

  fetchPages().then(function(items){
    state.rawItems=items;
    repaginate();
    hideOverlays();
    renderSpread(state.cur);
  }).catch(function(err){
    console.error(err);
    state.rawItems=[];
    repaginate();
    hideOverlays();
    renderSpread(state.cur);
  });
}

document.addEventListener("DOMContentLoaded",load);
})();
</script>
</body>
</html>
