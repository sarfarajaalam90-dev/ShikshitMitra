<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>पुस्तक | Shikshit Mitra</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* Brand palette */
  --green-dark:#1a4a2e;
  --green-mid:#2a6a40;
  --green-light:#eef5ec;
  --green-left:#e6f0e3;
  --green-rule:#c8dfc4;
  /* UI chrome */
  --bg:#0d1a12;
  --surface:#132a1c;
  --border:rgba(255,255,255,0.08);
  --text:#e8f0e9;
  --muted:#7a9e83;
  --accent:#8c6ed6;
  /* Page */
  --page-bg:var(--green-light);
  --page-bg-left:var(--green-left);
  --page-text:#1a2820;
  --page-head:#1a4a2e;
  --margin-w:36px;
}

html,body{height:100%;width:100%;background:var(--bg);color:var(--text);font-family:"Inter",sans-serif;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* ── Topbar — slim dark green ── */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:0 14px;height:34px;
  background:linear-gradient(90deg,var(--green-dark) 0%,var(--green-mid) 100%);
  flex-shrink:0;z-index:10;
}
.app-logo{width:20px;height:20px;border-radius:4px;object-fit:contain;flex-shrink:0;display:none}
.app-logo.visible{display:block}
.topbar-title{flex:1;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Noto Serif Devanagari",serif;color:#fff}
.topbar-page{font-size:11px;color:rgba(255,255,255,0.65);white-space:nowrap;font-variant-numeric:tabular-nums}
.topbar-page__sep{margin:0 1px}

/* ── Stage ── */
.stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  background:radial-gradient(ellipse at center,#162b1e 0%,#0d1a12 100%);
}

/* ── Book wrapper ── */
.book-wrap{perspective:2400px;display:flex;align-items:center;justify-content:center;position:relative}

/* ── The book ── */
.book{
  position:relative;display:flex;
  transform-style:preserve-3d;
  filter:drop-shadow(0 20px 40px rgba(0,0,0,0.7));
}

/* ── Page ── */
.page{width:var(--pw);height:var(--ph);background:var(--page-bg);position:relative;overflow:hidden;flex-shrink:0}
.page--left{border-radius:4px 0 0 4px;background:linear-gradient(to right,var(--page-bg-left),var(--page-bg));border-right:1px solid var(--green-rule)}
.page--right{border-radius:0 4px 4px 0;background:var(--page-bg)}
.page--left::after{content:"";position:absolute;top:0;right:0;width:24px;height:100%;background:linear-gradient(to left,rgba(0,0,0,0.06),transparent);pointer-events:none}
.page--right::before{content:"";position:absolute;top:0;left:0;width:24px;height:100%;background:linear-gradient(to right,rgba(0,0,0,0.04),transparent);pointer-events:none;z-index:1}

/* ── Spine — dark green ── */
.spine{
  width:10px;height:var(--ph);
  background:linear-gradient(to bottom,#1a4a2e,#0f2d1a,#1a4a2e);
  flex-shrink:0;
  box-shadow:inset -2px 0 4px rgba(0,0,0,0.4),inset 2px 0 4px rgba(0,0,0,0.4);
}

/* ── Page inner ── */
.page-inner{padding:0;height:100%;display:flex;flex-direction:column;position:relative;z-index:2}

/* ── Per-page header — dark green ribbon ── */
.pg-header{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;
  background:linear-gradient(135deg,var(--green-dark) 0%,var(--green-mid) 60%,#1e5c35 100%);
  flex-shrink:0;
}
.pg-logo{width:calc(26px * var(--fs,1));height:calc(26px * var(--fs,1));border-radius:5px;object-fit:contain;flex-shrink:0}
.pg-logo-blank{width:calc(26px * var(--fs,1));height:calc(26px * var(--fs,1));flex-shrink:0}
.pg-title-wrap{display:flex;flex-direction:column;overflow:hidden}
.pg-title{
  font-family:"Inter",sans-serif;font-size:calc(10px * var(--fs,1));font-weight:700;
  color:#fff;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;
}
.pg-title-nep{font-family:"Noto Serif Devanagari",serif;font-weight:600}

/* ── Page blocks ── */
.page-blocks{flex:1;overflow:hidden;padding:6px 0 2px}

/* ── Row: narrow number column + content ── */
.page-row{display:flex;align-items:flex-start;padding:0}
.margin-cell{width:var(--margin-w);flex-shrink:0;display:flex;justify-content:center;padding-top:3px}
.content-cell{flex:1;min-width:0;padding:0 16px 0 8px}

/* ── Question number ── */
.q-num{
  font-family:"Noto Serif Devanagari",serif;
  font-size:calc(10px * var(--fs,1));font-weight:700;
  color:var(--accent);text-align:center;line-height:1.6;
}

/* ── Question text — clean PDF style, no ruled lines ── */
.q-text-wrap{overflow:hidden}
.q-text{
  font-family:"Noto Serif Devanagari",serif;
  font-size:calc(13px * var(--fs,1));
  line-height:1.75;color:var(--page-text);
  white-space:pre-wrap;word-break:break-word;
  padding-bottom:10px;
}

/* ── Section banner — dark green ── */
.banner-row{padding:5px 16px 5px calc(var(--margin-w) + 8px)}
.section-banner{
  background:linear-gradient(135deg,var(--green-dark),var(--green-mid));
  color:#fff;font-family:"Noto Serif Devanagari",serif;
  font-size:calc(11px * var(--fs,1));font-weight:700;letter-spacing:.04em;
  text-align:center;padding:5px 10px;border-radius:4px;
}

/* ── Per-page footer — minimal, page number only ── */
.pg-footer{
  display:flex;align-items:center;
  padding:4px 14px;
  border-top:1px solid rgba(26,74,46,0.15);
  flex-shrink:0;
}
.pg-footer--right{justify-content:flex-end}
.pg-footer--left{justify-content:flex-start}
.pg-footer-num{
  font-family:"Inter",sans-serif;
  font-size:calc(8px * var(--fs,1));
  color:rgba(26,74,46,0.5);
  letter-spacing:.08em;
}

/* ── Flip animation ── */
.flip-container{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d;pointer-events:none;z-index:10}
.flip-container.is-right{left:50%;transform-origin:left center}
.flip-container.is-left{right:50%;transform-origin:right center}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.flip-face--back{transform:rotateY(180deg)}

/* ── Overlays ── */
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:30;border-radius:6px}
.overlay.is-hidden{display:none}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,0.08);border-top-color:var(--green-mid);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay-text{font-size:14px;color:var(--muted)}
.retry-btn{padding:8px 20px;background:var(--green-mid);color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:"Noto Serif Devanagari",serif}

/* ── Rich page content (admin Book Editor books) ──
   Scoped entirely under .rich-content so nothing here can affect the
   existing plain-text exam-question rendering above. */
.rich-row{padding:0 16px}
.rich-content{
  font-family:"Noto Serif Devanagari",serif;
  font-size:calc(13px * var(--fs,1));
  line-height:1.75;color:var(--page-text);
}
.rich-content h1,.rich-content h2,.rich-content h3{
  font-family:"Noto Serif Devanagari",serif;color:var(--page-head);
  line-height:1.3;margin:0 0 10px;
}
.rich-content h1{font-size:calc(18px * var(--fs,1))}
.rich-content h2{font-size:calc(16px * var(--fs,1))}
.rich-content h3{font-size:calc(14px * var(--fs,1))}
.rich-content p{margin:0 0 10px}
.rich-content ul,.rich-content ol{margin:0 0 10px 22px;padding:0}
.rich-content li{margin-bottom:4px}
.rich-content table{border-collapse:collapse;width:100%;margin:0 0 12px;font-size:calc(12px * var(--fs,1))}
.rich-content table th,.rich-content table td{border:1px solid var(--green-rule);padding:5px 8px;text-align:left}
.rich-content table th{background:var(--green-light);color:var(--green-dark);font-weight:700}
.rich-content img{max-width:100%;height:auto;border-radius:4px;margin:0 0 10px;display:block}
.rich-content blockquote{
  border-left:3px solid var(--green-mid);background:rgba(42,106,64,0.06);
  padding:8px 12px;margin:0 0 10px;border-radius:0 4px 4px 0;
}
/* Forward-compatible hook for a future "colored box" / note block type —
   the editor doesn't emit these yet, but the reader is ready when it does. */
.rich-content .callout,.rich-content .note-box{
  border:1px solid var(--green-rule);background:var(--green-light);
  border-radius:6px;padding:10px 12px;margin:0 0 10px;
}

/* ── Toolbar — prev | fullscreen | next ── */
.toolbar{
  display:flex;align-items:center;justify-content:space-between;
  height:52px;
  background:var(--surface);
  border-top:1px solid var(--border);
  flex-shrink:0;
  padding:0 8px;
}
.tbtn{
  width:42px;height:42px;
  background:transparent;border:none;border-radius:10px;
  color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;
  -webkit-tap-highlight-color:transparent;
}
.tbtn:hover{background:rgba(255,255,255,0.07);color:var(--text)}
.tbtn:active{background:rgba(255,255,255,0.12)}
.tbtn:disabled{opacity:.25;cursor:default;pointer-events:none}
.tbtn svg{width:20px;height:20px}
.tbtn--nav svg{width:22px;height:22px}
.tbtn--zoom svg{width:18px;height:18px}

/* ── Single page mode (mobile / narrow) ── */
.book.single .page--left{display:none}
.book.single .spine{display:none}
.book.single .page--right{border-radius:6px}

/* ── Toast ── */
.toast{
  position:fixed;bottom:64px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:#1a3d27;color:#d0e8d8;font-size:13px;
  padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:999;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Admin: key button (topbar, right side) ── */
.admin-key-btn{width:30px;height:30px;color:rgba(255,255,255,0.55);flex-shrink:0}
.admin-key-btn svg{width:17px;height:17px}
.admin-key-btn.is-active{color:#f4c95d}

/* ── Admin: modal shell (login + confirm dialogs) ── */
.modal-scrim{
  position:fixed;inset:0;background:rgba(6,12,8,0.72);
  display:flex;align-items:center;justify-content:center;
  z-index:200;padding:20px;
}
.modal-scrim.is-hidden{display:none}
.modal-card{
  background:var(--surface);border:1px solid var(--border);border-radius:14px;
  width:100%;max-width:320px;padding:22px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.modal-title svg{width:16px;height:16px;color:var(--accent)}
.modal-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.modal-field{margin-bottom:12px}
.modal-field label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
.modal-field input{
  width:100%;padding:9px 11px;border-radius:8px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);
  color:var(--text);font-size:13px;font-family:"Inter",sans-serif;
}
.modal-field input:focus{outline:none;border-color:var(--accent)}
.modal-err{font-size:12px;color:#e08585;margin:-2px 0 12px;min-height:14px}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-btn{
  flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;
  font-size:13px;font-weight:600;font-family:"Inter",sans-serif;
  transition:opacity .15s;
}
.modal-btn:active{opacity:.8}
.modal-btn--primary{background:var(--green-mid);color:#fff}
.modal-btn--ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.modal-btn:disabled{opacity:.5;cursor:default}

/* ── Admin: edit toolbar (bottom strip, appears when logged in) ── */
.edit-toolbar{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  display:flex;align-items:center;gap:4px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:14px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,0.45);
  z-index:150;
}
.edit-toolbar.is-hidden{display:none}
.edit-toolbar__btn{
  display:flex;align-items:center;gap:6px;
  padding:8px 12px;border-radius:9px;border:none;background:transparent;
  color:var(--text);font-size:12px;font-weight:600;cursor:pointer;
  font-family:"Inter",sans-serif;white-space:nowrap;
}
.edit-toolbar__btn svg{width:15px;height:15px;flex-shrink:0}
.edit-toolbar__btn:hover{background:rgba(255,255,255,0.07)}
.edit-toolbar__btn--accent{background:var(--green-mid);color:#fff}
.edit-toolbar__btn--accent:hover{background:var(--green-mid)}
.edit-toolbar__btn--danger{color:#e08585}
.edit-toolbar__sep{width:1px;align-self:stretch;background:var(--border);margin:4px 2px}

/* ── Admin: editing indicator on live page content ── */
.book.edit-mode .rich-content{
  outline:2px dashed rgba(140,110,214,0.55);outline-offset:4px;
  cursor:text;border-radius:4px;
}
.book.edit-mode .rich-content:focus{outline-color:var(--accent);background:rgba(140,110,214,0.06)}
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="tbtn" id="backBtn" aria-label="back" style="width:30px;height:30px;color:#fff">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <img class="app-logo" id="appLogo" alt="">
    <div class="topbar-title" id="bookTitle">शिक्षित मित्र</div>
    <div class="topbar-page">
      <span id="pageCurrent">–</span><span class="topbar-page__sep">/</span><span id="pageTotal">–</span>
    </div>
    <button class="tbtn admin-key-btn" id="adminKeyBtn" aria-label="Admin login" title="Admin">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
      </svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <div class="book-wrap" id="bookWrap">
      <div class="book" id="book">
        <div class="page page--left" id="pageLeft">
          <div class="page-inner" id="leftInner"></div>
        </div>
        <div class="spine"></div>
        <div class="page page--right" id="pageRight">
          <div class="page-inner" id="rightInner"></div>
        </div>
        <div class="flip-container" id="flipLeaf" style="display:none">
          <div class="flip-face flip-face--front" id="flipFront"></div>
          <div class="flip-face flip-face--back"  id="flipBack"></div>
        </div>
      </div>
      <div class="overlay" id="overlayLoad"><div class="spinner"></div><p class="overlay-text">पाना लोड हुँदैछ…</p></div>
      <div class="overlay is-hidden" id="overlayErr">
        <p class="overlay-text" id="errMsg">लोड गर्न सकिएन</p>
        <button class="retry-btn" id="retryBtn">फेरि प्रयास गर्नुहोस्</button>
      </div>
      <div class="overlay is-hidden" id="overlayComingSoon">
        <p class="overlay-text" id="comingSoonMsg">यो किताब चाँडै आउँदैछ… (Coming Soon)</p>
      </div>
    </div>
  </main>

  <!-- Bottom toolbar: Zoom− | Prev | Fullscreen | Next | Zoom+ -->
  <footer class="toolbar">
    <button class="tbtn tbtn--zoom" id="zoomOutBtn" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M8 11h6"/></svg>
    </button>
    <button class="tbtn tbtn--nav" id="prevBtn" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="tbtn" id="fullBtn" title="Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/>
        <path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
    <button class="tbtn tbtn--nav" id="nextBtn" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button class="tbtn tbtn--zoom" id="zoomInBtn" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v6M8 11h6"/></svg>
    </button>
  </footer>

  <div class="toast" id="toast"></div>

  <!-- Admin login modal -->
  <div class="modal-scrim is-hidden" id="loginScrim">
    <div class="modal-card">
      <div class="modal-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        Admin login
      </div>
      <div class="modal-sub">Sign in to edit this book.</div>
      <form id="loginForm">
        <div class="modal-field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" autocomplete="username" required>
        </div>
        <div class="modal-field">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" autocomplete="current-password" required>
        </div>
        <div class="modal-err" id="loginErr"></div>
        <div class="modal-actions">
          <button type="button" class="modal-btn modal-btn--ghost" id="loginCancelBtn">Cancel</button>
          <button type="submit" class="modal-btn modal-btn--primary" id="loginSubmitBtn">Log in</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Generic confirm modal (delete page / migrate to Firestore) -->
  <div class="modal-scrim is-hidden" id="confirmScrim">
    <div class="modal-card">
      <div class="modal-title" id="confirmTitle">Are you sure?</div>
      <div class="modal-sub" id="confirmSub"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn modal-btn--ghost" id="confirmCancelBtn">Cancel</button>
        <button type="button" class="modal-btn modal-btn--primary" id="confirmOkBtn">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Edit toolbar (visible once logged in as admin) -->
  <div class="edit-toolbar is-hidden" id="editToolbar">
    <button class="edit-toolbar__btn" id="addPageBtn" title="Add page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Page
    </button>
    <button class="edit-toolbar__btn edit-toolbar__btn--danger" id="delPageBtn" title="Delete current page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg>
      Delete
    </button>
    <div class="edit-toolbar__sep"></div>
    <button class="edit-toolbar__btn edit-toolbar__btn--accent" id="saveBookBtn" title="Save changes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
      Save
    </button>
    <div class="edit-toolbar__sep"></div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>

<script type="module">
/* ── Firebase (Firestore-backed books) ──────────────────────────────────
   This is intentionally a separate <script type="module"> block, kept apart
   from the main reader script below (which stays plain, non-module JS so
   nothing about it has to change). It only exposes one thing — a fetcher
   function — that the main script calls when a book is requested by
   Firestore id via ?bookId=. Analytics is intentionally omitted here since
   the reader has no use for it and it adds unrelated setup. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAoQk-gtf9pqwuRlyTZX9L0iYm86GkOoGM",
  authDomain: "book-ab15a.firebaseapp.com",
  projectId: "book-ab15a",
  storageBucket: "book-ab15a.firebasestorage.app",
  messagingSenderId: "762114975771",
  appId: "1:762114975771:web:27361a5f746dcc277fb0be"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const auth = getAuth(fbApp);

/* Fetches one book document from the `books` collection by id.
   Resolves to the plain book data object, or rejects if not found. */
window.SM_FIRESTORE_FETCHER = async function (bookId) {
  const snap = await getDoc(doc(db, "books", bookId));
  if (!snap.exists()) throw new Error("Book not found in Firestore: " + bookId);
  return snap.data();
};

/* ── Admin auth + write (added for the in-book editor) ─────────────────
   Any account that can successfully sign in counts as an admin — access
   is controlled by which accounts exist in Firebase Console > Authentication,
   not by anything in this file. */
window.SM_AUTH_LOGIN = function (email, password) {
  return signInWithEmailAndPassword(auth, email, password).then(function (cred) {
    return cred.user;
  });
};

window.SM_AUTH_LOGOUT = function () {
  return signOut(auth);
};

/* Fires once immediately with current state, then on every login/logout. */
window.SM_AUTH_ON_CHANGE = function (callback) {
  onAuthStateChanged(auth, function (user) { callback(user); });
};

/* Writes (creates or overwrites) a full book document. merge:false is not
   used — we always send the complete pages array, since the editor always
   holds the full current state of the book, not a partial diff. */
window.SM_FIRESTORE_SAVE = function (bookId, bookData) {
  return setDoc(doc(db, "books", bookId), bookData);
};
</script>

<script>

var BOOK_ID           = params.get("bookId") || "";

/* Doc id the admin editor saves to. If the book isn't Firestore-backed yet
   (no ?bookId=), we fall back to the CSV book key so the very first Save
   creates that Firestore doc — from then on it can be reopened with
   ?bookId=<this same value>. */
/* Generate a clean Firestore-safe doc ID from title + timestamp suffix. */
function generateBookId(title){
  var slug = (title||"book")
    .toLowerCase()
    .replace(/[\u0900-\u097F]+/g,"book")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,24)||"book";
  return slug+"-"+Date.now().toString(36);
}

var _tt;

  el.toast.textContent=msg;el.toast.classList.add("show");
  clearTimeout(_tt);_tt=setTimeout(function(){el.toast.classList.remove("show");},1800);

/* ── HTML escaping ── */
function esc(s){
  return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* ── Layout ──
   Nav arrows are now in the toolbar, so we use the full stage width.
   Mobile: fill width, cap height so the page isn't absurdly tall.
   Desktop: two pages side by side, each ~half of stage width. */
function layout(){
  var sw = el.stage.clientWidth;
  var sh = el.stage.clientHeight;
  state.single = sw < 520;

  var pw, ph;
  if(state.single){
    pw = Math.floor(sw * 0.96);
    ph = Math.min(Math.floor(sh * 0.97), Math.floor(pw * 1.55));
  } else {
    var usable = Math.floor(sw * 0.97) - 10; /* 10 = spine */
    pw = Math.floor(usable / 2);
    ph = Math.floor(sh * 0.97);
  }
  state.ph = ph;
  state.pw = pw;

  el.book.style.setProperty("--pw", pw + "px");
  el.book.style.setProperty("--ph", ph + "px");
  el.book.classList.toggle("single", state.single);

  var fs = Math.max(0.78, Math.min(1.25, pw / 300));
  el.book.style.setProperty("--fs", fs.toFixed(3));
}

/* ── Lines available per page ── */
function computeLinesPerPage(){
  return Math.max(5, Math.floor((state.ph - PAGE_OVERHEAD) / LINE_H));
}

/* ── Pack items into pages ── */
function buildPages(items, linesPerPage){
  var pages=[], current, used, lastSection;
  function startPage(){current={blocks:[]};pages.push(current);used=0;}
  startPage();
  items.forEach(function(item){
    var isFirst = current.blocks.length === 0;
    var needBanner = !!item.section && (isFirst || item.section !== lastSection);
    var cost = (needBanner ? SECTION_BANNER_LINES : 0) + item.lines;
    if(used > 0 && used + cost > linesPerPage){
      startPage();
      needBanner = !!item.section;
      cost = (needBanner ? SECTION_BANNER_LINES : 0) + item.lines;
    }
    if(needBanner){
      current.blocks.push({type:"banner", text:item.section});
      used += SECTION_BANNER_LINES;
      lastSection = item.section;
    }
    current.blocks.push({type:"question", title:item.title, content:item.content, lines:item.lines});
    used += item.lines;
    if(item.section) lastSection = item.section;
  });
  if(pages.length && pages[pages.length-1].blocks.length === 0) pages.pop();
  if(!pages.length) pages.push({blocks:[]});
  pages.forEach(function(p,i){ p.num = i+1; });
  return pages;
}

function repaginate(){
  if(state.richFormat){
    state.pages = state.richPages || [];
    TOTAL_PAGES = state.pages.length || 1;
    if(state.cur > TOTAL_PAGES) state.cur = TOTAL_PAGES;
    if(state.cur < 1) state.cur = 1;
    return;
  }
  var lpp = computeLinesPerPage();
  state.pages = buildPages(state.rawItems, lpp);
  TOTAL_PAGES = state.pages.length;
  if(state.cur > TOTAL_PAGES) state.cur = TOTAL_PAGES;
  if(state.cur < 1) state.cur = 1;
}

/* ── Build page HTML ── */
function buildPageInnerHTML(pageObj, isRight){
  if(!pageObj) return "";

  var logoTag = LOGO_SRC
    ? '<img class="pg-logo" src="' + esc(LOGO_SRC) + '" alt="" onerror="this.style.display=\'none\'">' 
    : '<span class="pg-logo-blank"></span>';

  /* Header ribbon */
  var html = '<div class="pg-header">'
           + logoTag
           + '<div class="pg-title-wrap">'
           + '<span class="pg-title">Shikshit Mitra '
           + '<span class="pg-title-nep">(शिक्षित मित्र)</span></span>'
           + '</div></div>';

  /* Content blocks */
  html += '<div class="page-blocks">';
  if(pageObj.rich){
    /* Admin Book Editor page — pre-authored, already-paginated rich HTML.
       Trusted content (produced by our own admin editor, not the CSV),
       so it's injected as-is rather than escaped. */
    html += '<div class="page-row rich-row"><div class="rich-content" data-page-num="' + esc(pageObj.num) + '">' + (pageObj.content || "") + '</div></div>';
  } else {
    pageObj.blocks.forEach(function(b){
      if(b.type === "banner"){
        html += '<div class="page-row banner-row"><div class="section-banner">' + esc(b.text) + '</div></div>';
      } else {
        html += '<div class="page-row">'
              + '<div class="margin-cell"><div class="q-num">' + esc(b.title) + '</div></div>'
              + '<div class="content-cell">'
              + '<div class="q-text-wrap" style="height:' + (b.lines * LINE_H) + 'px">'
              + '<div class="q-text">' + esc(b.content) + '</div>'
              + '</div></div></div>';
      }
    });
  }
  html += '</div>';

  /* Footer — page number only, aligned to outer edge */
  var footerClass = isRight ? "pg-footer pg-footer--right" : "pg-footer pg-footer--left";
  html += '<div class="' + footerClass + '">'
        + '<span class="pg-footer-num">' + esc(pageObj.num) + '</span>'
        + '</div>';

  return html;
}

/* ── Render spread ── */
function renderSpread(rightIdx){
  state.cur = rightIdx;
  var leftIdx = rightIdx - 1;
  var rightPage = state.pages[rightIdx - 1] || null;
  var leftPage  = (!state.single && leftIdx >= 1) ? state.pages[leftIdx - 1] : null;

  el.rightInner.innerHTML = buildPageInnerHTML(rightPage, true);
  el.leftInner.innerHTML  = buildPageInnerHTML(leftPage,  false);

  /* Page indicator: show spread range in dual mode */
  if(!state.single && leftPage){
    el.pageCurrent.textContent = (rightIdx - 1) + "–" + rightIdx;
  } else {
    el.pageCurrent.textContent = rightIdx;
  }
  el.pageTotal.textContent = TOTAL_PAGES;
  el.prevBtn.disabled = rightIdx <= 1;
  el.nextBtn.disabled = rightIdx >= TOTAL_PAGES;

  wireEditableContent();
}

/* ── Clone page for flip ── */
function clonePageHTML(pageData, isRight){
  var div = document.createElement("div");
  div.className = "page " + (isRight ? "page--right" : "page--left");
  div.style.cssText = "width:100%;height:100%;position:absolute;inset:0;";
  var inner = document.createElement("div");
  inner.className = "page-inner";
  inner.innerHTML = buildPageInnerHTML(pageData, isRight);
  div.appendChild(inner);
  return div.outerHTML;
}

/* ── Flip animation ── */
function animateFlip(toRight, toIdx, done){
  if(state.flipping) return;
  state.flipping = true;
  playFlipSound();
  var leaf = el.flipLeaf, front = el.flipFront, back = el.flipBack;
  var frontIdx, backIdx;
  if(toRight){frontIdx = state.cur; backIdx = toIdx; leaf.className = "flip-container is-right";}
  else{frontIdx = state.cur - 1; backIdx = toIdx - 1; leaf.className = "flip-container is-left";}
  front.innerHTML = clonePageHTML(state.pages[frontIdx - 1] || null, !toRight);
  back.innerHTML  = clonePageHTML(state.pages[backIdx  - 1] || null,  toRight);
  leaf.style.display = "block";
  leaf.style.transform = "rotateY(0deg)";
  leaf.style.transition = "none";
  leaf.getBoundingClientRect();
  var startAngle = 0, endAngle = toRight ? -180 : 180, startTime = null;
  function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
  function tick(ts){
    if(!startTime) startTime = ts;
    var t = Math.min((ts - startTime) / FLIP_MS, 1);
    leaf.style.transform = "rotateY(" + (startAngle + (endAngle - startAngle) * ease(t)) + "deg)";
    if(t < 1) requestAnimationFrame(tick);
    else{leaf.style.display = "none"; state.flipping = false; done();}
  }
  requestAnimationFrame(tick);
}

/* ── Navigation — dual mode jumps by 2 (spread pairs) ── */
function goNext(){
  if(state.flipping || state.cur >= TOTAL_PAGES) return;
  var step = state.single ? 1 : 2;
  var toIdx = Math.min(state.cur + step, TOTAL_PAGES);
  animateFlip(true, toIdx, function(){ renderSpread(toIdx); });
}
function goPrev(){
  if(state.flipping || state.cur <= 1) return;
  var step = state.single ? 1 : 2;
  var toIdx = Math.max(state.cur - step, 1);
  animateFlip(false, toIdx, function(){ renderSpread(toIdx); });
}

/* ── Swipe ── */
var _sx=0,_sy=0,_st=0;
el.stage.addEventListener("touchstart",function(e){
  var t=e.touches[0];_sx=t.clientX;_sy=t.clientY;_st=Date.now();
},{passive:true});
el.stage.addEventListener("touchend",function(e){
  var t=e.changedTouches[0];
  var dx=t.clientX-_sx,dy=t.clientY-_sy,dt=Date.now()-_st;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40&&dt<400){
    if(dx<0)goNext();else goPrev();
  }
},{passive:true});

/* ── Keyboard ── */
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown")goNext();
  if(e.key==="ArrowLeft" ||e.key==="ArrowUp")  goPrev();
});

});

/* ── Fullscreen ── */
el.fullBtn.addEventListener("click",function(){
  var isFull=document.fullscreenElement||document.webkitFullscreenElement;
  if(!isFull){
    var req=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
    if(req)req.call(document.documentElement);
  }else{
    (document.exitFullscreen||document.webkitExitFullscreen).call(document);
  }
});
function onFullscreenChange(){

}

el.retryBtn.addEventListener("click",load);

/* ── Zoom ── */
function applyZoom(){
  el.bookWrap.style.transform = "scale(" + zoomLevel + ")";
  el.zoomOutBtn.disabled = zoomLevel <= ZOOM_MIN;
  el.zoomInBtn.disabled  = zoomLevel >= ZOOM_MAX;
}
el.zoomInBtn.addEventListener("click", function(){
  zoomLevel = Math.min(ZOOM_MAX, Math.round((zoomLevel + ZOOM_STEP) * 10) / 10);
  applyZoom();
});
el.zoomOutBtn.addEventListener("click", function(){
  zoomLevel = Math.max(ZOOM_MIN, Math.round((zoomLevel - ZOOM_STEP) * 10) / 10);
  applyZoom();
});


var _rt;
window.addEventListener("resize",function(){
  clearTimeout(_rt);
  _rt=setTimeout(function(){layout();repaginate();renderSpread(state.cur);},200);
});

function showLoad(){el.overlayLoad.classList.remove("is-hidden");el.overlayErr.classList.add("is-hidden");el.overlayComingSoon.classList.add("is-hidden");}
function hideOverlays(){el.overlayLoad.classList.add("is-hidden");el.overlayErr.classList.add("is-hidden");el.overlayComingSoon.classList.add("is-hidden");}
function showComingSoon(title){
  el.overlayLoad.classList.add("is-hidden");
  el.overlayErr.classList.add("is-hidden");
  el.comingSoonMsg.textContent = (title ? title + " — " : "") + "चाँडै आउँदैछ (Coming Soon)";
  el.overlayComingSoon.classList.remove("is-hidden");
}

var TOTAL_PAGES = 1;

/* Renders a book object (from Firestore or from a static JSON file) that
   uses the "richPage" model — pages already fixed by the Book Editor. */
function applyRichBook(book){
  state.richFormat = true;
  state.title = book.title || state.title;
  el.bookTitle.textContent = state.title;
  state.richPages = (book.pages || []).map(function(p, i){
    return { num: i + 1, rich: true, title: p.title || "", content: p.content || "" };
  });
  repaginate();
  hideOverlays();
  renderSpread(state.cur);
}

function load(){
  showLoad();
  state.rawItems = [];
  state.richFormat = false;
  state.richPages = [];
  state.cur = 1;

  if(LOGO_SRC){
    el.appLogo.onload  = function(){ el.appLogo.classList.add("visible"); };
    el.appLogo.onerror = function(){ el.appLogo.classList.remove("visible"); };
    el.appLogo.src = LOGO_SRC;
  }

  layout();

  /* Newest format: Firestore-backed book, loaded live by id.
     Highest priority — takes over from the data= and CSV paths below
     whenever ?bookId= is present. */
  if(BOOK_ID){
    if(!window.SM_FIRESTORE_FETCHER){
      console.error("Firestore fetcher not ready yet");
      el.bookTitle.textContent = state.title;
      repaginate();
      hideOverlays();
      renderSpread(state.cur);
      return;
    }
    window.SM_FIRESTORE_FETCHER(BOOK_ID).then(function(book){
      /* Everyone using this page right now is treated as a student/reader —
         admin bypass for viewing drafts arrives with Edit Mode next. */
      if(book && book.published !== true){
        showComingSoon(book.title);
        return;
      }
      applyRichBook(book);
    }).catch(function(err){
      console.error(err);
      el.bookTitle.textContent = state.title;
      state.richFormat = false;
      state.richPages = [];
      repaginate();
      hideOverlays();
      renderSpread(state.cur);
    });
    return;
  }

  /* No bookId — show empty reader shell */
  el.bookTitle.textContent = state.title;
  repaginate();
  hideOverlays();
  renderSpread(state.cur);
}

/* ══════════════════════════════════════════════════════════════════════
   Admin editor — login, inline editing, add/delete page, save to Firestore
   ══════════════════════════════════════════════════════════════════════ */

/* Renders one non-rich page's blocks into the exact same HTML the reader
   view already produces, so switching a CSV-sourced book into the rich
   model (on first edit) doesn't change how it looks. */
function bakeBlocksToHTML(pageObj){
  var html = "";
  (pageObj.blocks || []).forEach(function(b){
    if(b.type === "banner"){
      html += '<div class="page-row banner-row"><div class="section-banner">' + esc(b.text) + '</div></div>';
    } else {
      html += '<div class="page-row">'
            + '<div class="margin-cell"><div class="q-num">' + esc(b.title) + '</div></div>'
            + '<div class="content-cell">'
            + '<div class="q-text-wrap" style="height:' + (b.lines * LINE_H) + 'px">'
            + '<div class="q-text">' + esc(b.content) + '</div>'
            + '</div></div></div>';
    }
  });
  return html;
}

/* Converts whatever is currently loaded (CSV-packed pages or an already-
   rich book) into the richPages model, in memory. Only takes effect once —
   safe to call every time edit mode is entered. */
function convertToRichIfNeeded(){
  if(state.richFormat) return;
  state.richPages = (state.pages || []).map(function(p, i){
    return { num: i + 1, rich: true, title: "", content: bakeBlocksToHTML(p) };
  });
  state.richFormat = true;
  repaginate();
}

/* Makes the currently visible page(s) editable and keeps state.richPages
   in sync as the admin types. Called after every render. */
function wireEditableContent(){
  [el.rightInner, el.leftInner].forEach(function(container){
    var node = container.querySelector(".rich-content");
    if(!node) return;
    if(state.editMode){
      node.setAttribute("contenteditable", "true");
      node.addEventListener("input", onEditableInput);
    } else {
      node.removeAttribute("contenteditable");
    }
  });
}

function onEditableInput(e){
  var num = parseInt(e.currentTarget.getAttribute("data-page-num"), 10);
  var pageObj = state.richPages[num - 1];
  if(pageObj) pageObj.content = e.currentTarget.innerHTML;
}

function enterEditMode(){
  convertToRichIfNeeded();
  state.editMode = true;
  el.book.classList.add("edit-mode");
  el.editToolbar.classList.remove("is-hidden");
  el.adminKeyBtn.classList.add("is-active");
  renderSpread(state.cur);
}

function exitEditMode(){
  state.editMode = false;
  el.book.classList.remove("edit-mode");
  el.editToolbar.classList.add("is-hidden");
  el.adminKeyBtn.classList.remove("is-active");
  renderSpread(state.cur);
}

/* Inserts a fresh blank page right after the one currently on the right. */
function addPage(){
  convertToRichIfNeeded();
  var atIdx = state.cur; /* insert after current right page */
  state.richPages.splice(atIdx, 0, { rich: true, title: "", content: "<p>यहाँ लेख्नुहोस्…</p>" });
  state.richPages.forEach(function(p, i){ p.num = i + 1; });
  repaginate();
  state.cur = atIdx + 1;
  renderSpread(state.cur);
  toast("Page added");
}

function deleteCurrentPage(){
  if(state.richPages.length <= 1){ toast("Can't delete the only page"); return; }
  var idx = state.cur - 1;
  state.richPages.splice(idx, 1);
  state.richPages.forEach(function(p, i){ p.num = i + 1; });
  repaginate();
  renderSpread(Math.min(state.cur, state.richPages.length));
  toast("Page deleted");
}

function saveBook(){
  convertToRichIfNeeded();
  if(!window.SM_FIRESTORE_SAVE){ toast("Firestore not ready — try again"); return; }
  var wasFirestoreBacked = !!BOOK_ID;

  /* Generate a unique ID on the very first save so we never use "untitled". */
  if(!EFFECTIVE_BOOK_ID){
    EFFECTIVE_BOOK_ID = generateBookId(state.title);
  }

  var payload = {
    title: state.title,
    published: true,
    pages: state.richPages.map(function(p){
      return { title: p.title || "", content: p.content || "" };
    })
  };
  el.saveBookBtn.disabled = true;
  window.SM_FIRESTORE_SAVE(EFFECTIVE_BOOK_ID, payload).then(function(){
    if(wasFirestoreBacked){
      toast("Saved ✓");
    } else {
      /* First save: update URL so the page is now bookId-aware.
         The admin can share or bookmark this URL directly. */
      BOOK_ID = EFFECTIVE_BOOK_ID;
      var newSearch = "?bookId=" + EFFECTIVE_BOOK_ID;
      if(params.get("title")) newSearch += "&title=" + encodeURIComponent(state.title);
      history.replaceState(null, "", window.location.pathname + newSearch);

      /* Tell the parent webapp (if we're embedded in an iframe) so it can
         remember this bookId and pass it back in next time it opens us.
         Harmless no-op when opened standalone (parent === window). */
      if(window.parent && window.parent !== window){
        window.parent.postMessage({ type: "SM_WRITTEN_EXAM_SAVED", bookId: EFFECTIVE_BOOK_ID }, "*");
      }

      toast("Saved ✓  URL updated — bookmark this page");
    }
  }).catch(function(err){
    console.error(err);
    toast("Save failed: " + (err && err.message ? err.message : "unknown error"));
  }).then(function(){
    el.saveBookBtn.disabled = false;
  });
}

/* ── Login modal ── */
function openLoginModal(){
  el.loginErr.textContent = "";
  el.loginScrim.classList.remove("is-hidden");
  el.loginEmail.focus();
}
function closeLoginModal(){
  el.loginScrim.classList.add("is-hidden");
  el.loginForm.reset();
}

el.adminKeyBtn.addEventListener("click", function(){
  if(!state.isAdmin) openLoginModal();
});
el.loginCancelBtn.addEventListener("click", closeLoginModal);
el.loginScrim.addEventListener("click", function(e){ if(e.target === el.loginScrim) closeLoginModal(); });

el.loginForm.addEventListener("submit", function(e){
  e.preventDefault();
  if(!window.SM_AUTH_LOGIN){ el.loginErr.textContent = "Not ready yet — try again in a moment."; return; }
  el.loginErr.textContent = "";
  el.loginSubmitBtn.disabled = true;
  window.SM_AUTH_LOGIN(el.loginEmail.value.trim(), el.loginPass.value)
    .then(function(){ closeLoginModal(); })
    .catch(function(){ el.loginErr.textContent = "Login failed — check email and password."; })
    .then(function(){ el.loginSubmitBtn.disabled = false; });
});

/* ── Confirm dialog (reused for delete + logout) ── */
var _confirmAction = null;
function askConfirm(title, sub, onOk){
  el.confirmTitle.textContent = title;
  el.confirmSub.textContent = sub;
  _confirmAction = onOk;
  el.confirmScrim.classList.remove("is-hidden");
}
el.confirmCancelBtn.addEventListener("click", function(){
  el.confirmScrim.classList.add("is-hidden");
  _confirmAction = null;
});
el.confirmOkBtn.addEventListener("click", function(){
  el.confirmScrim.classList.add("is-hidden");
  if(_confirmAction) _confirmAction();
  _confirmAction = null;
});

/* ── Edit toolbar actions ── */
el.addPageBtn.addEventListener("click", addPage);
el.delPageBtn.addEventListener("click", function(){
  askConfirm("Delete this page?", "This removes the currently open right-hand page. You'll still need to Save to make it permanent.", deleteCurrentPage);
});
el.saveBookBtn.addEventListener("click", saveBook);
el.logoutBtn.addEventListener("click", function(){
  askConfirm("Log out?", "Unsaved changes on this page will be lost unless you Save first.", function(){
    if(window.SM_AUTH_LOGOUT) window.SM_AUTH_LOGOUT();
  });
});

/* ── Auth state ── */
(function wireAdminAuth(){
  if(!window.SM_AUTH_ON_CHANGE){ setTimeout(wireAdminAuth, 150); return; }
  window.SM_AUTH_ON_CHANGE(function(user){
    state.isAdmin = !!user;
    if(user) enterEditMode(); else exitEditMode();
  });
})();

document.addEventListener("DOMContentLoaded", load);
})();
</script>
