<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
<title>PDF Flipbook Demo — DearFlip</title>

<!-- Flipbook StyleSheet -->
<link href="dflip/css/dflip.min.css" rel="stylesheet" type="text/css">
<!-- Icons Stylesheet -->
<link href="dflip/css/themify-icons.min.css" rel="stylesheet" type="text/css">

<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #1b1d22;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: #23252b;
    border-bottom: 1px solid #33363d;
    color: #eef0f3;
  }

  #topbar .brand {
    font-weight: 600;
    font-size: 15px;
  }
  #topbar .brand .badge {
    font-size: 11px;
    font-weight: 500;
    color: #9aa0ab;
    border: 1px solid #33363d;
    border-radius: 20px;
    padding: 1px 8px;
    margin-left: 6px;
  }

  #flipbookContainer {
    height: calc(100vh - 53px);
    width: 100%;
  }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">📖 PDF Flipbook <span class="badge">DearFlip demo</span></div>
</header>

<div id="flipbookContainer"></div>

<!-- jQuery (required, bundled with DearFlip) -->
<script src="dflip/js/libs/jquery.min.js" type="text/javascript"></script>
<!-- Flipbook main JS (bundles its own PDF.js + Three.js build for 3D page turns) -->
<script src="dflip/js/dflip.min.js" type="text/javascript"></script>

<script>
  // Documented JS-options setup (js.dearflip.com/docs/basic-usages) — gives
  // access to options (autoEnableThumbnail, autoEnableOutline) that the
  // plain HTML-attribute method doesn't expose.
  jQuery(document).ready(function ($) {
    var source_pdf = "book.pdf";
    var option_pdf = {
      webgl: true,               // realistic 3D page-turn rendering
      height: "100%",            // fill the container, responsive on resize
      backgroundColor: "#1b1d22",
      enableDownload: true,      // adds the "Download PDF" toolbar button
      autoEnableThumbnail: true, // page-thumbnail panel available from the toolbar
      autoEnableOutline: false,  // this PDF has no bookmarks/outline to show
      duration: 800
    };
    $("#flipbookContainer").flipBook(source_pdf, option_pdf);
  });
</script>

</body>
</html>
